
name: Lint Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Verify project directories
        run: |
          test -d djangoapp || {
            echo "::error::Directory server/djangoapp not found"
            exit 1
          }
          test -d djangoproj || {
            echo "::error::Directory server/djangoproj not found"
            exit 1
          }

      - name: Lint Python code
        run: |
          python -m flake8 djangoapp djangoproj \
            --count \
            --statistics \
            --max-line-length=120 \
            --extend-ignore=W503 \
            --exclude=migrations

 
  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server/database

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install JSHint
        run: npm install --global jshint

      - name: Verify JavaScript files
        run: |
          for file in app.js review.js dealership.js inventory.js; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing JavaScript file: $file"
              exit 1
            fi
          done

      - name: Lint JavaScript code
        run: |
          jshint app.js review.js dealership.js inventory.js


          for file in app.js review.js dealership.js inventory.js; do
            test -f "$file" || {
              echo "::error::Missing JavaScript file: $file"
              exit 1
            }
          done

      - name: Lint JavaScript code
        run: |
          jshint --config .jshintrc \
            app.js review.js dealership.js inventory.js
