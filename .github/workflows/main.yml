name: 'Lint Code'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          cd server
          flake8 --count --statistics \
            --max-line-length=120 \
            --extend-ignore=W503 \
            --exclude=migrations,manage.py \
            djangoapp djangoproj
          echo "Python lint completed with no issues"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install jshint
        run: npm install -g jshint

      - name: Lint database JS with jshint
        run: |
          cd server/database
          jshint --config .jshintrc app.js review.js dealership.js inventory.js
          echo "JavaScript lint completed with no issues"
